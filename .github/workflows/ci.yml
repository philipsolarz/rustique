name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, core tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # rustup reads rust-toolchain.toml (Rust 1.99.1 + rustfmt + clippy).
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python maturin pytest hypothesis numpy
      - run: .venv/bin/maturin develop --uv --profile dev-release
      - run: .venv/bin/python -m pytest -q
      - name: Examples
        run: for f in examples/*.py; do .venv/bin/python "$f"; done
      - name: Type stubs (mypy --strict, pyright strict)
        if: matrix.python == '3.15'
        run: |
          uv pip install --python .venv/bin/python mypy pyright
          .venv/bin/python -m mypy
          .venv/bin/pyright

  wheels:
    name: Wheels (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, python]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.14
            3.15
            3.15t
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          manylinux: 2_28
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist
