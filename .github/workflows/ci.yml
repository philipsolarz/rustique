name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, core tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # rustup reads rust-toolchain.toml (Rust 1.99.1 + rustfmt + clippy).
      - run: rustup show active-toolchain
      # PyO3 builds against the interpreter it finds: the bindings need CPython >= 3.14
      # C-API functions, and rustique-py's unit tests link libpython.
      - uses: astral-sh/setup-uv@v7
      - name: Python 3.15 for PyO3
        run: |
          uv python install 3.15
          py=$(uv python find 3.15)
          echo "PYO3_PYTHON=$py" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$("$py" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --python .venv/bin/python maturin pytest hypothesis numpy
      - run: .venv/bin/maturin develop --uv --profile dev-release
      - run: .venv/bin/python -m pytest -q
      - name: Type stubs (mypy --strict, pyright strict)
        if: matrix.python == '3.15'
        run: |
          uv pip install --python .venv/bin/python mypy pyright
          .venv/bin/python -m mypy
          .venv/bin/pyright

  # Wheels for every platform and build, and the sdist: .github/workflows/wheels.yml.
