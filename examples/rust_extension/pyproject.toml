[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rustique-demo"
description = "Example PyO3 extension returning and borrowing rustique Lists via rustique-api"
requires-python = ">=3.13"
dependencies = ["rustique>=0.2"]
dynamic = ["version"]

[tool.maturin]
module-name = "rustique_demo"
