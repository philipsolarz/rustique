[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rustique"
description = "Python's data model, Rust's memory: typed native containers and zero-copy Rust/Python interop"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "hypothesis>=6.170.9",
]
bench = ["numpy>=2.5.4"]

[tool.maturin]
manifest-path = "crates/rustique-py/Cargo.toml"
python-source = "python"
module-name = "rustique._rustique"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
