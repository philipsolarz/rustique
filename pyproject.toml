[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rustique"
description = "Python's data model, Rust's memory: typed native containers and zero-copy Rust/Python interop"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/philipsolarz/rustique/blob/main/docs/USAGE.md"
Repository = "https://github.com/philipsolarz/rustique"

# `pytest --rustique` (inactive unless the flag is given; docs/USAGE.md). The entry point is
# named like the module so that `-p rustique.pytest_plugin` loads it through the entry point
# instead of registering the module a second time.
[project.entry-points.pytest11]
"rustique.pytest_plugin" = "rustique.pytest_plugin"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "hypothesis>=6.170.9",
    "mypy",
    "pyright",
]
bench = ["numpy>=2.5.4"]

[tool.maturin]
manifest-path = "crates/rustique-py/Cargo.toml"
python-source = "python"
module-name = "rustique._rustique"
profile = "release"
editable-profile = "dev"
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
# uv/pip build wheels from the sdist; ship the toolchain pin so they use Rust 1.99.1.
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    # The startup switch (docs/USAGE.md): placed at the root of site-packages, outside the
    # package. In the sdist too, so that wheels built from it ship them.
    { path = "python/_rustique_startup.py", format = ["sdist", "wheel"] },
    { path = "python/_rustique_startup.pth", format = ["sdist", "wheel"] },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.mypy]
mypy_path = "python"
strict = true
files = ["python/rustique/__init__.pyi", "examples/*.py"]

[tool.pyright]
include = ["python/rustique/__init__.pyi", "examples/*.py"]
typeCheckingMode = "strict"
extraPaths = ["python"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
