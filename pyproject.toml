[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rustique"
description = "CPython with a Rust engine: the same objects and results, faster, with one switch"
readme = "README.md"
# The upper bound is deliberate (docs/targets/dx.md §5): PyO3 0.30 cannot build for 3.16, and an
# unknown interpreter must be refused at install time with a clear message, not by a failed
# Rust build from the sdist. Raise it when a release is validated on the next minor.
requires-python = ">=3.14,<3.16"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/philipsolarz/rustique/blob/main/docs/USAGE.md"
Repository = "https://github.com/philipsolarz/rustique"

# `pytest --rustique` (inactive unless the flag is given; docs/USAGE.md). The entry point is
# named like the module so that `-p rustique.pytest_plugin` loads it through the entry point
# instead of registering the module a second time.
[project.entry-points.pytest11]
"rustique.pytest_plugin" = "_rustique_pytest"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "hypothesis>=6.170.9",
    "mypy",
    "pyright",
]

[tool.maturin]
manifest-path = "crates/rustique-py/Cargo.toml"
python-source = "python"
module-name = "rustique._rustique"
profile = "release"
editable-profile = "dev"
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
# uv/pip build wheels from the sdist; ship the toolchain pin so they use Rust 1.99.1.
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    # The startup switch (docs/USAGE.md): one .pth line at the root of site-packages. In the
    # sdist too, so that wheels built from it ship it.
    { path = "python/_rustique_startup.pth", format = ["sdist", "wheel"] },
    # The pytest plugin, top-level so that autoloading it does not import the package.
    { path = "python/_rustique_pytest.py", format = ["sdist", "wheel"] },
    # Top-level `_rustique` for maturin's in-package layout (the extension stays in
    # `rustique/`): the `.pth` line and `import rustique` import `_rustique` in every layout.
    # Release wheels are repacked by tools/repack_wheel.py: the extension itself moves to the
    # top level and this shim is dropped (docs/DECISIONS.md §10.7).
    { path = "python/_rustique.py", format = ["sdist", "wheel"] },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.mypy]
mypy_path = "python"
strict = true
files = ["python/rustique/__init__.pyi"]

[tool.pyright]
include = ["python/rustique/__init__.pyi"]
typeCheckingMode = "strict"
extraPaths = ["python"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
