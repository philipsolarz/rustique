[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "rustique"
description = "Python's data model, Rust's memory: typed native containers and zero-copy Rust/Python interop"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "pytest>=9.1.1",
    "hypothesis>=6.170.9",
    "mypy",
    "pyright",
]
bench = ["numpy>=2.5.4"]

[tool.maturin]
manifest-path = "crates/rustique-py/Cargo.toml"
python-source = "python"
module-name = "rustique._rustique"
profile = "release"
editable-profile = "dev"
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
# uv/pip build wheels from the sdist; ship the toolchain pin so they use Rust 1.99.1.
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.mypy]
mypy_path = "python"
strict = true
files = ["python/rustique/__init__.pyi", "examples"]

[tool.pyright]
include = ["python/rustique/__init__.pyi", "examples"]
typeCheckingMode = "strict"
extraPaths = ["python"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
